<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flexbox - justify-content</title>
  <link rel="stylesheet" href="09_flexbox_justify.css">

</head>

<body>

  <h1>Nivel de los Cursos</h1>

  <h2>Principiante (inicio)</h2>
  <div class="contenedor inicio">
    <div class="item">HTML</div>
    <div class="item">CSS</div>
    <div class="item">JS</div>
  </div>

  <h2>Avanzado (fin)</h2>
  <div class="contenedor fin">
    <div class="item">React</div>
    <div class="item">Node</div>
    <div class="item">AWS</div>
  </div>

  <h2>Destacados (centro)</h2>
  <div class="contenedor centro">
    <div class="item">SQL</div>
    <div class="item">Java</div>
    <div class="item">Git</div>
  </div>

  <h2>Ruta Frontend</h2>
  <div class="contenedor between">
    <div class="item">UI</div>
    <div class="item">UX</div>
    <div class="item">Dev</div>
  </div>

  <h2>Ruta Backend</h2>
  <div class="contenedor around">
    <div class="item">API</div>
    <div class="item">DB</div>
    <div class="item">Ops</div>
  </div>

  <h2>Ruta Mobile</h2>
  <div class="contenedor evenly">
    <div class="item">iOS</div>
    <div class="item">Dart</div>
    <div class="item">Java</div>
  </div>

</body>
</html>
