<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alineación de Cursos</title>
  <link rel="stylesheet" href="10_flexbox_align.css">


</head>
<body>

  <h2>Módulos (stretch)</h2>
  <div class="contenedor stretch">
    <div class="item">Python</div>
    <div class="item">Django</div>
    <div class="item">Odoo</div>
  </div>

  <h2>Nivel Básico</h2>
  <div class="contenedor inicio">
    <div class="item">HTML</div>
    <div class="item">CSS</div>
    <div class="item">JS</div>
  </div>

  <h2>Nivel Experto</h2>
  <div class="contenedor fin">
    <div class="item">Docker</div>
    <div class="item">Linux</div>
    <div class="item">DevOps</div>
  </div>

  <h2>Clases en Vivo</h2>
  <div class="contenedor centro">
    <div class="item">Lunes</div>
    <div class="item">Martes</div>
    <div class="item">Jueves</div>
  </div>

  <h2>Certificaciones</h2>
  <div class="contenedor baseline">
    <div class="item">Diploma</div>
    <div class="item">Certificado Pro</div>
    <div class="item">Máster Internacional</div>
  </div>

</body>
</html>
