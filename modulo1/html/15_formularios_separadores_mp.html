<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
</head>
<body>
    <H1>Formulario de Inscripción</H1>
    <form action="/procesar" method="post">
        <fieldset>
            <legend>Información del Estudiante</legend>
            <label for="nombre">Nombres</label><br>
            <input type="text" id="nombre" name="nombre"><br>
            <label for="nombre">Apellidos</label><br>
            <input type="text" id="apellido" name="apellido">
        </fieldset>

        <fieldset>
            <legend>Credenciales del Curso</legend>
            <label for="email">Correo del Estudiante</label><br>
            <input type="email" id="email" name="email"><br>
            <label for="password">Contraseña de Acceso</label><br>
            <input type="password" id="password" name="password">
        </fieldset>
        <button type="submit">Finalizar Registro</button>
    </form>
</body>
</html>
