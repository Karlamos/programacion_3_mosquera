<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción de Cursos</title>
</head>
<body>
    <h1>Registro de Estudiante</h1>
    <form action="/procesar" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre Completo</label><br>
                    <input type="text" id="nombre" name="nombre">
                </td>
                <td>
                    <label>Correo Institucional<br>
                        <input type="email" id="email" name="email">
                    </label>
                </td>
            </tr>
            <tr>
    
                <td> <label for="password">Clave de Acceso</label><br>
                    <input type="password" id="password" name="password">
                </td>
                <td>
                    <label for="url">Portafolio (GitHub/Lab)</label><br>
                    <input type="url" id="url" name="url">
                </td>
            </tr>

            <tr>
    
                <td> <label for="telefono">WhatsApp de Contacto</label><br>
                    <input type="tel" id="telefono" name="telefono">
                </td>
                <td>
                    <label for="buscar"> Temas de interés</label><br>
                    <input type="search" id="buscar" name="buscar">
                </td>
            </tr>

            <tr>
    
                <td> <label for="edad">Nivel de Semestre</label><br>
                    <input type="number" id="edad" name="edad" min="1" max="10" step="1">
                </td>
                <td>
                    <label for="Volumen"> Progreso en el curso <span id="val-vol">0</span>%</label><br>
                    <input type="range" id="volumen" name="volumen" min="0" max="100" value="0"
                    oninput="document.getElementById('val-vol').textContent=this.value">
                </td>
            </tr>

        </table>
        
        <button type="submit">Inscribirme ahora</button>
    </form>
</body>
</html>
